networks:
  app-network:
    driver: bridge

services:
  mysql:
    image: mysql:8.4.10
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    networks:
      - app-network
    environment:
      MYSQL_ROOT_PASSWORD: Zzz199519...
    volumes:
      - /opt/apps/docker/mysql:/var/lib/mysql

  redis:
    image: redis:6.2
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network

  app:
    image: qianguanguan:latest
    container_name: qianguanguan
    restart: unless-stopped
    ports:
      - "8888:8888"
    networks:
      - app-network
    volumes:
      - /opt/apps/qianguanguan/upload:/app/upload
      - /opt/apps/qianguanguan/logs:/app/logs
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/qianguanguan?characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Zzz199519...
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"

  nginx:
    image: nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network
    volumes:
      - /opt/apps/docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - /opt/apps/docker/nginx/cert:/etc/nginx/cert
      - /opt/apps/qianguanguan/dist:/opt/apps/qianguanguan/dist
      - /opt/apps/qianguanguan/upload:/opt/apps/qianguanguan/upload
