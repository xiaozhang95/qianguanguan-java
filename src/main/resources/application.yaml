spring:
  application:
    name: qianguanguan-java
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/qianguanguan?characterEncoding=UTF-8&useSSL=false
    username: root
    password: '00000000'
  mvc:
    static-path-pattern: /static/**
server:
  port: 8888
springdoc:
  swagger-ui:
    persist-authorization: true
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      table-prefix: t_
      id-type: assign_id
security:
  whitelist:
    - /static/**
    - /upload
  swagger-paths:
    - /v3/api-docs
    - /v3/api-docs/**
    - /swagger-ui
    - /swagger-ui/**
    - /swagger-ui.html
    - /swagger-resources/**
  jwt:
    secret: 1234567890abcdef1234567890abcdef
    expiration: 3600000
